services:

  # ── PostgreSQL database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-bc_agent}
      POSTGRES_USER:     ${POSTGRES_USER:-bcagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bcagent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bc_agent}
      ENVIRONMENT: production
      # Part Finder reads its prebuilt SQLite index + cover thumbnails from here,
      # and serves source manuals from the corpus root. Both are host-mounted
      # below (the index is a ~200MB artifact + 6GB corpus, kept out of the image).
      PARTFINDER_OUTPUT_DIR: /data/partfinder
      PARTFINDER_LIBRARY_ROOT: /data/library
    volumes:
      - backend_data:/app/data
      # Prebuilt Part Finder index (index.db must be in rollback-journal mode so
      # the read-only mount works) + cover images.
      - ${PARTFINDER_INDEX_DIR:-/opt/partfinder-data/index}:/data/partfinder:ro
      # DoorPart-Library corpus — source PDFs for the gated manual-download route.
      - ${PARTFINDER_LIBRARY_DIR:-/opt/partfinder-data/library}:/data/library:ro

  # ── Nginx + React frontend ────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt certs (managed by certbot on the host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot webroot for renewals
      - /var/www/certbot:/var/www/certbot:ro

volumes:
  postgres_data:
  backend_data:
